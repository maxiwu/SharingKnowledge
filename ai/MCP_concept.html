<main>
<header>
<h1>MCP 概念圖解筆記</h1>
<p>從傳統 API 一步步走到 MCP：角色分工、server 設計、架構取捨與傳輸方式。每個概念一張圖。</p>
<nav id="toc"></nav>
</header>
<div id="content"></div>
<div class="summary">
<strong>一句話總結</strong>
<ul>
<li><b>模型</b>只讀 schema、輸出「想呼叫什麼」；<b>Host</b> 組 context、把關、轉發並跑 agent loop；<b>MCP server</b> 提供 schema 並執行。</li>
<li>Tool use 是「模型 ↔ app」，MCP 是「app ↔ 工具」；MCP 讓 adapter 寫一次就能到處接。</li>
<li>好的 MCP tool 就是好的 use case：需要一致性的流程封裝在 server，需要判斷力的串接交給 host。</li>
</ul>
</div>
</main>

let uid=0;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lines(x,y,t,cls='',anchor='middle'){
  const ls=String(t).split('\n'),lh=17,y0=y-(ls.length-1)*lh/2;
  return `<text class="${cls}" text-anchor="${anchor}">`+ls.map((l,i)=>`<tspan x="${x}" y="${y0+i*lh}">${esc(l)}</tspan>`).join('')+`</text>`;
}
const T=(x,y,t,c='',a='middle')=>lines(x,y,t,c,a);
const B=(x,y,w,h,t,c='')=>`<g class="b ${c}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>${lines(x+w/2,y+h/2+4.5,t)}</g>`;
const Z=(x,y,w,h,t='')=>`<g class="zone"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/></g>`+(t?lines(x+10,y+16,t,'small ttl','start'):'');
const L=(x1,y1,x2,y2,c='a thin')=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
function A(x1,y1,x2,y2,lab='',o={}){
  return id=>{
    let s=`<line class="a" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${o.dash?'stroke-dasharray="5 4"':''} marker-end="url(#${id})" ${o.both?`marker-start="url(#${id})"`:''}/>`;
    if(lab){
      const mx=(x1+x2)/2,my=(y1+y2)/2,h=Math.abs(x2-x1)>=Math.abs(y2-y1);
      s+=lines(o.lx??(h?mx:mx+7),o.ly??(h?my-7:my+4),lab,'lab',o.a??(h?'middle':'start'));
    }
    return s;
  };
}
function P(pts,lab,o={}){
  return id=>`<polyline class="a" points="${pts.map(p=>p.join(',')).join(' ')}" ${o.dash?'stroke-dasharray="5 4"':''} marker-end="url(#${id})"/>`+(lab?lines(o.lx,o.ly,lab,'lab',o.a||'middle'):'');
}
function S(w,h,label,parts){
  const id='m'+(++uid);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>${parts.flat(Infinity).map(p=>typeof p==='function'?p(id):p).join('')}</svg>`;
}
function Seq(xs,names,top,gap,msgs,H){
  const out=[];
  xs.forEach(x=>out.push(L(x,42,x,H-8,'life')));
  xs.forEach((x,i)=>out.push(B(x-58,10,116,32,names[i])));
  msgs.forEach((m,i)=>{const y=top+i*gap;out.push(A(xs[m[0]],y,xs[m[1]],y,m[2],{dash:m[3]}));});
  return out;
}
